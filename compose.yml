# Multi-app dev cluster: prebuilt ubuntu-mise:dev + local nginx + Postgres + Redis.
#
# Build base first:  cd ../ubuntu-mise && task build
# Warm caches:       task warm
# Build nginx once:  bin/compose build nginx
# Run:               task up:all | task up -- app1
#
# Volume `cache` → /cache (mise/gems/yarn). Project at WORK_MOUNT (default /work).
# Override: WORK_MOUNT=/app in .mise.env or environment (must match volumes).
# Package cache paths: ubuntu-mise image user configs + image ENV (not compose).
#   See ubuntu-mise docs/runtime-env-not-required.md
# Env layers (cluster-tasks docs/ENV.md):
#   config/shared.env   — committed non-secrets (RAILS_ENV, …)
#   .common.env         — shared secrets (vault; via compose.secrets.yml)
#   .<app>.env          — per-app secrets (vault; via compose.secrets.yml)
#   config/compose.env  — generated by bin/compose for ${IMAGE} etc. (not .env)
# Compose project name = directory basename. Topology only — no healthchecks;
# bin/docker-app waits for Postgres; Rails db:prepare creates DBs.

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-cluster}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluster}

# Topology only (project bind path). Package-cache ENV (BUNDLE_*/YARN_*/MISE_*)
# comes from ubuntu-mise image — do not re-list here. For non-default WORK_MOUNT,
# also pass MISE_TRUSTED_CONFIG_PATHS to match (image defaults trust /work).
x-work-env: &work-env
  WORK_MOUNT: ${WORK_MOUNT:-/work}
  WORKSPACE: ${WORK_MOUNT:-/work}

# Shared by every Rails app (and optional `dev` shell).
# App non-secrets only — package caches from image; vault via compose.secrets.yml.
x-app: &app
  image: ${IMAGE:-ubuntu-mise:dev}
  pull_policy: never
  working_dir: ${WORK_MOUNT:-/work}
  env_file:
    - config/shared.env
  environment:
    <<: [*db-env, *work-env]
  volumes:
    - .:${WORK_MOUNT:-/work}:cached
    - cache:/cache
  stdin_open: true
  tty: true
  depends_on:
    - db
    - redis
    - nginx
  command: ["bash", "-lc", "exec $${WORK_MOUNT}/bin/docker-app"]

services:
  db:
    image: postgres:${POSTGRESQL_VERSION:-18}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cluster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluster}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"

  redis:
    image: redis:${REDIS_VERSION:-8}-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${NGINX_IMAGE:-cluster-nginx:dev}
    pull_policy: never
    ports:
      - "8080:8080"

  dev:
    <<: *app
    profiles: ["dev"]
    depends_on:
      - db
      - redis
    command: ["bash", "-lc", "mise install && exec bash"]

  # --- Apps (deltas only; keep in sync with config/apps.yml) -----------------

  fred:
    <<: *app
    working_dir: ${WORK_MOUNT:-/work}/fred
    ports:
      - "3001:3001"
    environment:
      <<: [*db-env, *work-env]
      PORT: "3001"
      RAILS_RELATIVE_URL_ROOT: /fred
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/fred_development
      REDIS_URL: redis://redis:6379/0

  ron:
    <<: *app
    working_dir: ${WORK_MOUNT:-/work}/ron
    ports:
      - "3002:3002"
    environment:
      <<: [*db-env, *work-env]
      PORT: "3002"
      RAILS_RELATIVE_URL_ROOT: /ron
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/ron_development
      REDIS_URL: redis://redis:6379/1

  harry:
    <<: *app
    working_dir: ${WORK_MOUNT:-/work}/harry
    ports:
      - "3003:3003"
    environment:
      <<: [*db-env, *work-env]
      PORT: "3003"
      RAILS_RELATIVE_URL_ROOT: /harry
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/harry_development
      REDIS_URL: redis://redis:6379/2

  george:
    <<: *app
    working_dir: ${WORK_MOUNT:-/work}/george
    ports:
      - "3004:3004"
    environment:
      <<: [*db-env, *work-env]
      PORT: "3004"
      RAILS_RELATIVE_URL_ROOT: /george
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/george_development
      REDIS_URL: redis://redis:6379/3

volumes:
  pgdata:
  cache:
    name: cache
    external: true
