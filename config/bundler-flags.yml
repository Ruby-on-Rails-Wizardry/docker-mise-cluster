---
# Shared Bundler *behavior* (not install paths).
# Symlinked as .bundle/config and <app>/.bundle/config.
# Paths: BUNDLE_PATH / BUNDLE_CACHE_PATH / BUNDLE_USER_HOME (image or bin/cache-env).
# Plugins (bootboot) live under BUNDLE_USER_HOME — keep that on /cache, not ~/.bundle.
BUNDLE_CACHE_ALL: "true"
BUNDLE_CACHE_ALL_PLATFORMS: "true"
BUNDLE_DISABLE_SHARED_GEMS: "true"
BUNDLE_CLEAN: "false"
BUNDLE_JOBS: "4"
BUNDLE_RETRY: "3"
