# Cluster members — apps and shared gems.
# Edit this file when adopting the template (clone/copy/untar) into a project.
#
# Apps are expected as git submodules at `path` (see .gitmodules.example).
# The bundled fred/ and george/ trees are demo apps for the template only.

apps:
  - name: fred
    path: fred
    port: 3000
    # url_root: /fred          # optional; for later nginx integration
    # health: /up              # default /up
  - name: george
    path: george
    port: 3001

# Shared path-gems mounted into the workspace (optional for MVP).
# When present, bin/setup does not treat them as Rails apps unless listed under apps.
shared_gems: []
# Example:
# shared_gems:
#   - name: example_gem
#     path: example_gem
