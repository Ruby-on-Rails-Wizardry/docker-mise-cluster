# Host UX for the multi-app Ubuntu cluster. Requires Task: https://taskfile.dev
# Install via mise (see mise.toml):  mise install
# bin/* implements the same commands without Task.
#
# Prebuilt base only: IMAGE=ubuntu-mise:dev (pull_policy: never).
#   cd ../ubuntu-mise && task build
#   task warm
#   task up:all           # or up:fred | up:ron | up:harry | up:george
#
# Shared volume `cache` → /cache. Compose project name = directory basename.

version: "3"

env:
  FLAVOR_BASE: ubuntu-mise
  IMAGE: '{{.IMAGE | default "ubuntu-mise:dev"}}'
  CACHE_VOLUME: '{{.CACHE_VOLUME | default "cache"}}'
  PROJECT:
    sh: 'printf %s "${PROJECT:-{{.USER_WORKING_DIR}}}"'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  config:
    desc: Print effective image / volume / project settings
    cmds:
      - ./bin/config

  doctor:
    desc: Host / Docker / base image / apps / nginx sanity
    cmds:
      - ./bin/doctor

  setup:
    desc: "Ensure image (optional) + warm cache (task setup -- --docker-build)"
    cmds:
      - ./bin/setup {{.CLI_ARGS}}

  warm:
    desc: Warm volume cache (crawl Gemfile / package.json inside the image)
    cmds:
      - ./bin/warm

  cache:ensure:
    desc: Create the shared /cache volume
    aliases: [cache]
    cmds:
      - ./bin/cache-ensure

  cache:reset:
    desc: "Delete shared /cache volume (task cache:reset -- -y)"
    cmds:
      - ./bin/cache-reset {{.CLI_ARGS}}

  compose:
    desc: "Pass-through to bin/compose (task compose -- ps)"
    cmds:
      - ./bin/compose {{.CLI_ARGS}}

  compose:config:
    desc: Show resolved cluster compose config
    cmds:
      - ./bin/compose config

  up:
    desc: "bin/compose up (task up -- fred | ron | harry | george)"
    interactive: true
    cmds:
      - ./bin/compose up {{.CLI_ARGS}}

  up:fred:
    desc: Bring up fred + nginx + db + redis
    interactive: true
    cmds:
      - ./bin/compose up fred

  up:ron:
    desc: Bring up ron + nginx + db + redis
    interactive: true
    cmds:
      - ./bin/compose up ron

  up:harry:
    desc: Bring up harry + nginx + db + redis
    interactive: true
    cmds:
      - ./bin/compose up harry

  up:george:
    desc: Bring up george + nginx + db + redis
    interactive: true
    cmds:
      - ./bin/compose up george

  up:all:
    desc: Bring up all four apps + shared deps
    interactive: true
    cmds:
      - ./bin/compose up fred ron harry george

  down:
    desc: bin/compose down
    cmds:
      - ./bin/compose down {{.CLI_ARGS}}

  apps:
    desc: Show apps from config/apps.yml
    cmds:
      - ./bin/apps yaml

  db:
    desc: Start only Postgres + Redis
    cmds:
      - ./bin/compose up -d db redis

  db:reset:
    desc: "Reset app DB(s) — task db:reset -- fred ron | …"
    cmds:
      - ./bin/db-reset {{.CLI_ARGS}}

  db:reset:fred:
    desc: Reset fred_development
    cmds:
      - ./bin/db-reset fred

  db:reset:ron:
    desc: Reset ron_development
    cmds:
      - ./bin/db-reset ron

  db:reset:harry:
    desc: Reset harry_development
    cmds:
      - ./bin/db-reset harry

  db:reset:george:
    desc: Reset george_development
    cmds:
      - ./bin/db-reset george

  shell:dev:
    desc: Interactive shell in ubuntu-mise:dev (compose profile dev)
    interactive: true
    cmds:
      - ./bin/compose --profile dev run --rm dev

  # App-scoped Task (delegates into submodule trees)
  fred:
    desc: "Run a task in fred/ (task fred -- setup | shell | compose:up)"
    dir: fred
    cmds:
      - task {{.CLI_ARGS}}

  ron:
    desc: "Run a task in ron/ (task ron -- setup | shell | compose:up)"
    dir: ron
    cmds:
      - task {{.CLI_ARGS}}

  harry:
    desc: "Run a task in harry/ (task harry -- setup | shell | compose:up)"
    dir: harry
    cmds:
      - task {{.CLI_ARGS}}

  george:
    desc: "Run a task in george/ (task george -- setup | shell | compose:up)"
    dir: george
    cmds:
      - task {{.CLI_ARGS}}

  mise:install:
    desc: Install tools from mise.toml (includes Task)
    cmds:
      - |
        if command -v mise >/dev/null 2>&1; then
          mise trust . 2>/dev/null || true
          mise install
        else
          echo "error: mise not found" >&2
          exit 1
        fi
