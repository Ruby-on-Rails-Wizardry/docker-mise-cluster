# Path-based reverse proxy for the multi-app cluster.
# Pattern drawn from partial/nginx (without oauth2-proxy).
#
#   /           → static home page (links to apps)
#   /fred/*     → fred:3001   (prefix stripped; RAILS_RELATIVE_URL_ROOT=/fred)
#   /ron/*      → ron:3002
#   /harry/*    → harry:3003
#   /george/*   → george:3004
#
# Upstream hostnames use variables + Docker DNS so nginx can start (and re-resolve)
# without failing if a backend is briefly absent.
# Keep locations in sync with config/apps.yml.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # Docker Compose embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade map (used by proxy.conf)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name localhost;

        # Home page with links to each app
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # --- fred ---
        location = /fred {
            return 302 /fred/;
        }

        location /fred/ {
            include /etc/nginx/proxy.conf;
            set $upstream_fred fred:3001;
            rewrite ^/fred/?(.*)$ /$1 break;
            proxy_pass http://$upstream_fred;
        }

        # --- ron ---
        location = /ron {
            return 302 /ron/;
        }

        location /ron/ {
            include /etc/nginx/proxy.conf;
            set $upstream_ron ron:3002;
            rewrite ^/ron/?(.*)$ /$1 break;
            proxy_pass http://$upstream_ron;
        }

        # --- harry ---
        location = /harry {
            return 302 /harry/;
        }

        location /harry/ {
            include /etc/nginx/proxy.conf;
            set $upstream_harry harry:3003;
            rewrite ^/harry/?(.*)$ /$1 break;
            proxy_pass http://$upstream_harry;
        }

        # --- george ---
        location = /george {
            return 302 /george/;
        }

        location /george/ {
            include /etc/nginx/proxy.conf;
            set $upstream_george george:3004;
            rewrite ^/george/?(.*)$ /$1 break;
            proxy_pass http://$upstream_george;
        }
    }
}
