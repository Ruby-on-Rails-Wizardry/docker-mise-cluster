# Multi-app dev cluster: prebuilt ubuntu-mise:dev + nginx + Postgres + Redis.
#
# No cluster image build — apps use the local base tag only (pull_policy: never).
# Build the base first:  cd ../ubuntu-mise && task build
#
# Cache *relative* paths: config/cache-layout.env (single source of truth).
# Always run via: bin/compose …  (writes .env + loads cache-layout.env)
# App list SSOT: config/apps.yml  (keep compose services in sync for MVP)
#
# Prefer host-warmed caches: bin/setup && bin/compose up fred
#   (or: bin/compose up ron | harry | george | all four)
#
# Project mount: cluster root → /work  (WORKDIR; same contract as ubuntu-mise)
# Shared /cache volume: same name as ubuntu-mise (ubuntu-mise-cache) for tools.
# Compose project name: directory basename (do not hardcode in .env).
#
# Dependency order (apps pull the rest via depends_on):
#   db, redis, nginx  ← brought up with any app
#   fred / ron / harry / george  ← pick any subset
#
# Data services (dev credentials only — not for production):
#   db    → PostgreSQL (major from POSTGRESQL_VERSION / .mise.env, default 18)
#   redis → Redis 8

x-cache-env: &cache-env
  BUNDLE_PATH: /work/${CACHE_BUNDLE:-.cache/bundle}
  BUNDLE_CACHE_PATH: /work/${CACHE_RUBYGEMS:-.cache/rubygems}
  YARN_CACHE_FOLDER: /work/${CACHE_YARN_FOLDER:-.cache/yarn-cache}

# Do not set USER/HOME here — use the identity baked into ubuntu-mise:dev at build.
# Dev: mise install at runtime into /cache (volume). Prod apps: install at image build only.
x-runtime-env: &runtime-env
  WORKSPACE: /work
  CACHE_ROOT: /cache
  MISE_DATA_DIR: /cache/mise
  MISE_CACHE_DIR: /cache/mise-cache
  # Trust bind-mounted mise.toml under /work (root + app dirs). Matches ubuntu-mise.
  MISE_TRUSTED_CONFIG_PATHS: /work
  # Host zone via bin/compose (export TZ=… to override); base image ships tzdata
  TZ: ${TZ:-UTC}

# Shared Postgres/Redis connection defaults for app services.
# Override via .env (see .env.example / .mise.env). Values are intentionally simple for local dev.
x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-cluster}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluster}
  REDIS_URL: redis://redis:6379/0

x-service-env: &service-env
  <<: [*cache-env, *runtime-env, *db-env]

x-healthcheck: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 90s

# Shared by all apps: data stores + front-door proxy.
# Compose pulls these in automatically when you `up` an app service.
x-app-depends: &app-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  nginx:
    condition: service_healthy

# App container defaults (YAML anchor only — not a service).
# Prebuilt ubuntu-mise:dev only — never pull from a registry.
x-app-base: &app-base
  image: ${IMAGE:-ubuntu-mise:dev}
  pull_policy: never
  # No `user:` override — image Dockerfile USER from build.
  working_dir: /work
  environment:
    <<: *service-env
  volumes:
    # Whole cluster root (apps, .cache, node_modules, config) → /work
    - .:/work:cached
    # Shared mise tool installs (runtime `mise install`; same volume as ubuntu-mise)
    - type: volume
      source: mise-cache
      target: /cache
  stdin_open: true
  tty: true

services:
  # --- Data stores -----------------------------------------------------------

  db:
    hostname: db
    image: postgres:${POSTGRESQL_VERSION:-18}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cluster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluster}
      # Default DB for the superuser; per-app DBs from init script
      POSTGRES_DB: postgres
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data).
      # See https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]

  redis:
    hostname: redis
    image: redis:${REDIS_VERSION:-8}-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
      test: ["CMD", "redis-cli", "ping"]

  # --- Front door (before apps so one-app `up` still gets a proxy) ------------
  # Path routing; backends resolve at request time (missing app → 502, not nginx crash).
  # Apps depend on nginx; nginx does not depend on apps.

  nginx:
    hostname: nginx
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
      # busybox wget is in nginx:alpine
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]

  # --- Optional interactive shell (whole cluster tree) -----------------------

  dev:
    <<: *app-base
    hostname: dev
    profiles: ["dev"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bash", "-lc", "mise install && exec bash"]

  # --- Apps (ports/paths must match config/apps.yml) -------------------------
  # Run any subset; depends_on pulls nginx + db + redis.
  #   bin/compose up fred
  #   bin/compose up ron harry
  #   bin/compose up fred ron harry george

  fred:
    <<: *app-base
    hostname: fred
    working_dir: /work/fred
    environment:
      <<: *service-env
      PORT: "3001"
      RAILS_RELATIVE_URL_ROOT: /fred
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/fred_development
      REDIS_URL: redis://redis:6379/0
    command: ["bash", "-lc", "exec $$WORKSPACE/bin/docker-app"]
    ports:
      - "3001:3001"
    depends_on:
      <<: *app-depends
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3001/up"]

  ron:
    <<: *app-base
    hostname: ron
    working_dir: /work/ron
    environment:
      <<: *service-env
      PORT: "3002"
      RAILS_RELATIVE_URL_ROOT: /ron
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/ron_development
      REDIS_URL: redis://redis:6379/1
    command: ["bash", "-lc", "exec $$WORKSPACE/bin/docker-app"]
    ports:
      - "3002:3002"
    depends_on:
      <<: *app-depends
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3002/up"]

  harry:
    <<: *app-base
    hostname: harry
    working_dir: /work/harry
    environment:
      <<: *service-env
      PORT: "3003"
      RAILS_RELATIVE_URL_ROOT: /harry
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/harry_development
      REDIS_URL: redis://redis:6379/2
    command: ["bash", "-lc", "exec $$WORKSPACE/bin/docker-app"]
    ports:
      - "3003:3003"
    depends_on:
      <<: *app-depends
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3003/up"]

  george:
    <<: *app-base
    hostname: george
    working_dir: /work/george
    environment:
      <<: *service-env
      PORT: "3004"
      RAILS_RELATIVE_URL_ROOT: /george
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/george_development
      REDIS_URL: redis://redis:6379/3
    command: ["bash", "-lc", "exec $$WORKSPACE/bin/docker-app"]
    ports:
      - "3004:3004"
    depends_on:
      <<: *app-depends
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3004/up"]

volumes:
  pgdata:
  # mise tool installs for dev runtime (`mise install` → MISE_DATA_DIR=/cache/mise)
  mise-cache:
    name: ${CACHE_VOLUME:-ubuntu-mise-cache}
