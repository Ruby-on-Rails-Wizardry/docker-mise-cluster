# Multi-app dev cluster: Ubuntu + mise image, shared Bundler/Yarn caches.
#
# Cache *relative* paths: config/cache-layout.env (single source of truth).
# Always run via: bin/compose …   (injects that file for ${CACHE_*} interpolation)
# App list SSOT: config/apps.yml  (keep compose services in sync for MVP)
#
# Prefer host-warmed caches: bin/setup && bin/compose up fred
#   (or: bin/compose up george | bin/compose up fred george)
#
# Project mount: cluster root → /work  (WORKDIR; same contract as ubuntu-mise)
#
# Dependency order (apps pull the rest via depends_on):
#   db, redis, nginx  ← brought up with any app
#   fred / george     ← pick one or both
#
# Data services (dev credentials only — not for production):
#   db    → PostgreSQL 18  (fred_development, george_development, …)
#   redis → Redis 8

x-cache-env: &cache-env

  BUNDLE_PATH: /work/${CACHE_BUNDLE:-.cache/bundle}
  BUNDLE_CACHE_PATH: /work/${CACHE_RUBYGEMS:-.cache/rubygems}
  YARN_CACHE_FOLDER: /work/${CACHE_YARN_FOLDER:-.cache/yarn-cache}

# Container login name (build + runtime). Defaults to host $USER, else "dev".
x-runtime-env: &runtime-env
  HOME: /home/${USER:-dev}
  USER: ${USER:-dev}
  WORKSPACE: /work
  MISE_DATA_DIR: /home/${USER:-dev}/.local/share/mise
  # Trust bind-mounted mise.toml under /work (root + app dirs). Matches ubuntu-mise.
  MISE_TRUSTED_CONFIG_PATHS: /work

# Shared Postgres/Redis connection defaults for app services.
# Override via .env (see .env.example). Values are intentionally simple for local dev.
x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-cluster}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluster}
  REDIS_URL: redis://redis:6379/0

x-service-env: &service-env
  <<: [*cache-env, *runtime-env, *db-env]

x-healthcheck: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 90s

# Shared by fred/george: data stores + front-door proxy.
# Compose pulls these in automatically when you `up` an app service.
x-app-depends: &app-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  nginx:
    condition: service_healthy

# App container defaults (YAML anchor only — not a service).
# Image is a thin layer on local ubuntu-mise (see Dockerfile BASE_IMAGE).
# fred + george + dev share this image; build after: task ubuntu:build
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BASE_IMAGE: ${BASE_IMAGE:-ubuntu-mise:dev}
      USER: ${USER:-dev}
      DEV_UID: ${DEV_UID:-1000}
      DEV_GID: ${DEV_GID:-1000}
      POSTGRESQL_VERSION: ${POSTGRESQL_VERSION:-18}
  image: ${CLUSTER_IMAGE:-wf-dev:latest}
  user: ${USER:-dev}
  working_dir: /work
  environment:
    <<: *service-env
  volumes:
    # Whole cluster root (apps, .cache, node_modules, config) → /work
    - .:/work:cached
  stdin_open: true
  tty: true

services:
  # --- Data stores -----------------------------------------------------------

  db:
    image: postgres:${POSTGRESQL_VERSION:-18}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cluster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluster}
      # Default DB for the superuser; per-app DBs from init script
      POSTGRES_DB: postgres
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data).
      # See https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]

  redis:
    image: redis:${REDIS_VERSION:-8}-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
      test: ["CMD", "redis-cli", "ping"]

  # --- Front door (before apps so one-app `up` still gets a proxy) ------------
  # Path routing; backends resolve at request time (missing app → 502, not nginx crash).
  # Apps depend on nginx; nginx does not depend on apps.

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
      # busybox wget is in nginx:alpine
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]

  # --- Optional interactive shell --------------------------------------------

  dev:
    <<: *app-base
    profiles: ["dev"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bash", "-lc", "mise install && exec bash"]

  # --- Apps (ports/paths must match config/apps.yml) -------------------------
  # Run one or both; depends_on pulls nginx + db + redis.
  #   bin/compose up fred
  #   bin/compose up george
  #   bin/compose up fred george

  fred:
    <<: *app-base
    working_dir: /work/fred
    environment:
      <<: *service-env
      PORT: "3000"
      # Path prefix when reached via nginx (see nginx/nginx.conf)
      RAILS_RELATIVE_URL_ROOT: /fred
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/fred_development
      # App-specific Redis logical DB (0 = fred, 1 = george)
      REDIS_URL: redis://redis:6379/0
    command: ["bash", "-lc", "exec $$WORKSPACE/bin/docker-app"]
    ports:
      - "3000:3000"
    depends_on:
      <<: *app-depends
    healthcheck:
      <<: *healthcheck-defaults
      # App still serves /up; nginx strips /fred before proxying
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]

  george:
    <<: *app-base
    working_dir: /work/george
    environment:
      <<: *service-env
      PORT: "3001"
      RAILS_RELATIVE_URL_ROOT: /george
      DATABASE_URL: postgresql://${POSTGRES_USER:-cluster}:${POSTGRES_PASSWORD:-cluster}@db:5432/george_development
      REDIS_URL: redis://redis:6379/1
    command: ["bash", "-lc", "exec $$WORKSPACE/bin/docker-app"]
    ports:
      - "3001:3001"
    depends_on:
      <<: *app-depends
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3001/up"]

volumes:
  pgdata:
