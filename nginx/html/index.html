<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cluster</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        width: min(28rem, 92vw);
        padding: 2rem;
        border-radius: 1rem;
        background: #1e293b;
        box-shadow: 0 20px 50px rgb(0 0 0 / 35%);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        color: #94a3b8;
        line-height: 1.5;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }
      a {
        display: block;
        padding: 0.9rem 1rem;
        border-radius: 0.6rem;
        background: #334155;
        color: #f8fafc;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.15s ease;
      }
      a:hover,
      a:focus-visible {
        background: #475569;
        outline: none;
      }
      a span {
        display: block;
        margin-top: 0.2rem;
        font-size: 0.85rem;
        font-weight: 400;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Multi-app cluster</h1>
      <p>Nginx reverse proxy over the demo Rails apps. Pick a service:</p>
      <ul>
        <li>
          <a href="/fred/">Fred <span>/fred → fred:3001</span></a>
        </li>
        <li>
          <a href="/ron/">Ron <span>/ron → ron:3002</span></a>
        </li>
        <li>
          <a href="/harry/">Harry <span>/harry → harry:3003</span></a>
        </li>
        <li>
          <a href="/george/">George <span>/george → george:3004</span></a>
        </li>
      </ul>
    </main>
  </body>
</html>
