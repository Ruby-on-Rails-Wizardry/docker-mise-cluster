---
# Default Bundler *behavior* (not install paths). Seeded once per app as a
# private <app>/.bundle/config by bin/ensure-bundle-config — never a shared
# symlink (bootboot and bundle config set --local must not cross apps).
#
# Install paths come from ubuntu-mise image ENV + user configs (not compose):
# BUNDLE_PATH, BUNDLE_CACHE_PATH under /cache. Multi-app shared path:
#   BUNDLE_CLEAN false  — do not prune installed gems for sibling apps
#   BUNDLE_NO_PRUNE true — do not prune shared cache on `bundle cache`
BUNDLE_CACHE_ALL: "true"
BUNDLE_CACHE_ALL_PLATFORMS: "true"
BUNDLE_DISABLE_SHARED_GEMS: "true"
BUNDLE_CLEAN: "false"
BUNDLE_NO_PRUNE: "true"
BUNDLE_JOBS: "4"
BUNDLE_RETRY: "3"
