# Cluster members — apps and shared gems.
# Edit this file when adopting the template (clone/copy/untar) into a project.
#
# Apps are git submodules at `path` (see .gitmodules). Demo apps:
#   fred  → git@github.com:Ruby-on-Rails-Wizardry/fred.git
#   ron   → git@github.com:Ruby-on-Rails-Wizardry/ron.git
#   harry → git@github.com:Ruby-on-Rails-Wizardry/harry.git
#   george → git@github.com:Ruby-on-Rails-Wizardry/george.git
#
# Keep compose.yml services and nginx/nginx.conf in sync with ports / url_root / database.
# DBs: Rails db:prepare creates missing databases.

apps:
  - name: fred
    path: fred
    port: 3001
    url_root: /fred            # nginx path prefix (RAILS_RELATIVE_URL_ROOT)
    database: fred_development # Postgres DB on compose `db` (DATABASE_URL)
    redis_db: 0                # REDIS_URL logical DB index
  - name: ron
    path: ron
    port: 3002
    url_root: /ron
    database: ron_development
    redis_db: 1
  - name: harry
    path: harry
    port: 3003
    url_root: /harry
    database: harry_development
    redis_db: 2
  - name: george
    path: george
    port: 3004
    url_root: /george
    database: george_development
    redis_db: 3

# Shared library gems (own repos / submodules). Not Rails apps.
# Gemfiles pin a published version (Nexus or git tag). Cluster dev uses
# bundle config local.<name> via bin/local-gem-env → path under the cluster root.
shared_gems:
  - name: wizardry_shared
    path: wizardry_shared
