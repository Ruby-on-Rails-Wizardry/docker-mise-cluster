# Env layering (cluster-tasks docs/ENV.md).
# Non-secrets: config/shared.env (committed).
# Shared secrets: .common.env (vault / gitignore).
# Per-app secrets: .<name>.env
# Package /cache layout: ubuntu-mise image (not listed here).
# bin/compose writes config/compose.env for interpolation only — leaves .env alone.

shared:
  - config/shared.env

shared_secrets:
  - .common.env

app_secrets: {}

options:
  require_secrets: false
  secrets_compose: compose.secrets.yml
